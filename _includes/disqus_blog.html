<div id="disqus_thread"></div>
<script>
  var disqus_config = function () {
    this.page.url = "https://sirrychen.github.io/blogs/";
    this.page.identifier = "https://sirrychen.github.io/blogs/";
  };
  (() => {
    const details = document.getElementById('disqus_thread').closest('details');
    let loaded = false;
    function loadComments() {
      if (loaded || (details && !details.open)) return;
      loaded = true;
      const script = document.createElement('script');
      script.src = 'https://sirrychen.disqus.com/embed.js';
      script.setAttribute('data-timestamp', Date.now());
      document.head.appendChild(script);
    }
    if (details) details.addEventListener('toggle', loadComments);
    else loadComments();
  })();
</script>
<noscript>Enable JavaScript to view the comments.</noscript>
