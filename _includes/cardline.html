<article class="note-entry">
  <a class="note-image" href="{{ include.url | relative_url }}" tabindex="-1" aria-hidden="true"><img src="{{ include.img | relative_url }}" alt="" width="160" height="100" loading="lazy"></a>
  <div><h3><a href="{{ include.url | relative_url }}">{{ include.title }}</a></h3><p>{{ include.content }}</p></div>
</article>
